---
- name: cdp neighbors on device
  hosts: cisco_ios
  gather_facts: no

  tasks:
  - name: execute the command
    ios_command:
      commands:
        - show cdp neighbor detail
    register: cdp_output
    retries: 2
    delay: 5
    until: cdp_output is succeeded

  - name: exteact neighbot device id
    set_fact:
      neighbor_ids: "{{ cdp_output.stdout[0] | regex_findall('Device ID:\\s*(\\S+)')}}"

  - name: Extract Device ID + IP pairs together in one pass
    set_fact:
      cdp_neighbors: "{{ cdp_output.stdout[0] | regex_findall('Device ID:\\s*(\\S+)(?:(?!Device ID:)[\\s\\S])*?IP address:\\s*([\\d.]+)') }}"

  - name: Display the parsed neighbor list
    debug:
      var: cdp_neighbors

  - name: Confirm at least one neighbor was parsed
    assert:
      that:
        - cdp_neighbors | length > 0
      fail_msg: "No CDP neighbors parsed - check CDP is enabled, or output format doesn't match"
      success_msg: "Parsed {{ cdp_neighbors | length }} CDP neighbor(s)"

  
