---
- name: Check vlan summary
  hosts: cisco_ios
  gather_facts: false

  tasks:
    - name: Run the vlan command
      cisco.ios.ios_command:
        commands:
          - show vlan brief
      register: vlan_output
      retries: 2
      delay: 5
      until: vlan_output is succeeded

    - name: Extrace vlan ID and Name
      ansible.builtin.set_fact:
        vlan_list: "{{ vlan_output.stdout[0] | regex_findall('^(\\d+)\\s+(\\S+)', multiline=True) }}"

    - name: Display vlan output
      ansible.builtin.debug:
        var: vlan_list

    - name: Confirm atlest one vlan is parsed
      ansible.builtin.assert:
        that:
          - vlan_list | length > 0
        fail_msg: No VLANs parsed - check output format matches the regex
        success_msg: Parsed {{ vlan_list | length }} VLAN(s)
