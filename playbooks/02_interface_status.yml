---
- name: Interface status on R1
  hosts: cisco_ios
  gather_facts: false

  tasks:
    - name: Execute the command and store output
      cisco.ios.ios_command:
        commands:
          - show ip interface brief
          - show version
      register: interface_output
      retries: 2
      delay: 5
      until: interface_output is succeeded

    - name: Display interface status
      ansible.builtin.debug:
        var: interface_output.stdout_lines
