---
- name: Critical interface check
  hosts: cisco_ios
  gather_facts: false

  tasks:
    - name: Gather interface facts
      cisco.ios.ios_facts:
        gather_subset:
          - interfaces
      register: facts_result

    - name: Check each critical interface individually
      ansible.builtin.debug:
        msg: "{{ facts_result.ansible_facts.ansible_net_interfaces[item] }}"
      loop: "{{ facts_result.ansible_facts.ansible_net_interfaces.keys() | list }}"
